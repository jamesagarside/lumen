[workspace]
resolver = "2"
members = [
    "crates/lumen-core",
    "crates/lumen-daemon",
    "crates/lumen-plugin-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-only"
repository = "https://github.com/jamesagarside/lumen"
authors = ["James Garside"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }

# Tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.31"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", features = ["grpc-tonic", "trace"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
anyhow = "1"
thiserror = "2"

# Storage
redb = "2"

# Auth
argon2 = "0.5"
rand = "0.8"
hex = "0.4"

# HTTP client (integrations)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
dotenvy = "0.15"

# Networking helpers
ipnet = "2"

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# Internal
lumen-core = { path = "crates/lumen-core" }
lumen-plugin-sdk = { path = "crates/lumen-plugin-sdk" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
